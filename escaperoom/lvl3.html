<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>El Despacho del Detective | Osorno Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; --ink:#eee7d9; --muted:#b4ad9d; --accent:#c9a866; --line:rgba(238,231,217,.2); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#111216; color:var(--ink); font:15px/1.4 Georgia,'Times New Roman',serif; }
    #scene { position:fixed; inset:0; z-index:0; }
    canvas { display:block; width:100%; height:100%; }
    .hud { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:space-between; padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)); }
    .topbar,.bottom { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .title { margin:0; font-size:clamp(22px,4vw,38px); font-weight:400; text-shadow:0 2px 18px #000; }
    .eyebrow { margin:0 0 4px; color:var(--accent); font:11px/1.2 Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    .status { max-width:360px; padding:10px 12px; border:1px solid var(--line); background:rgba(16,17,22,.86); color:var(--muted); font:12px/1.3 Arial,sans-serif; pointer-events:auto; }
    .panel { max-width:450px; padding:16px 18px; border-left:2px solid var(--accent); background:rgba(16,17,22,.9); box-shadow:0 8px 30px rgba(0,0,0,.4); pointer-events:auto; }
    .panel p { margin:0 0 12px; }
    .help { color:var(--muted); font:12px/1.35 Arial,sans-serif; }
    .button { border:1px solid var(--accent); padding:10px 14px; background:var(--accent); color:#17130c; cursor:pointer; font:700 12px Arial,sans-serif; letter-spacing:.7px; text-transform:uppercase; }
    .button.secondary { border-color:var(--line); background:rgba(16,17,22,.85); color:var(--ink); }
    .button:disabled { cursor:wait; opacity:.65; }
    .button:focus-visible { outline:2px solid white; outline-offset:3px; }
    .success { display:none; color:#b9e8c8; }
    .success.visible { display:block; }
    .clue { display:none; padding:9px; border:1px solid rgba(201,168,102,.35); background:rgba(80,57,24,.24); color:#f1d79c; font:700 13px/1.35 Arial,sans-serif; }
    .clue.visible { display:block; }
    .keypad { display:none; margin-top:12px; }
    .keypad.visible { display:block; }
    .code-display { min-height:36px; margin-bottom:8px; padding:8px; border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--accent); font:700 20px/1.1 monospace; letter-spacing:6px; }
    .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .key-button { min-height:38px; border:1px solid var(--line); background:#2a2b31; color:var(--ink); cursor:pointer; font:700 16px Arial,sans-serif; }
    .key-button:hover { background:#3c3d45; }
    @media (max-width:560px) { .topbar,.bottom { align-items:stretch; flex-direction:column; } .status { align-self:flex-start; } .panel { max-width:none; } }
  </style>
</head>
<body>
  <main id="scene" aria-label="Despacho del detective en 3D"></main>
  <section class="hud">
    <div class="topbar">
      <div><p class="eyebrow">Osorno Battle / Nivel 3</p><h1 class="title">El Despacho del Detective</h1></div>
      <div id="sensor-status" class="status" role="status" aria-live="polite">Sensores en espera</div>
    </div>
    <div class="bottom">
      <div class="panel">
        <p id="prompt">Examina el archivo del caso y observa el reflejo junto al cuadro.</p>
        <p class="help">Mueve el teléfono o arrastra con el dedo/mouse. Enfoca un objeto para que aparezca su acción.</p>
        <p id="clue" class="clue"></p>
        <p id="success" class="success">¡Caso resuelto! La puerta está desbloqueada.</p>
        <button id="sensor-button" class="button" type="button">Activar sensores</button>
        <button id="recenter-button" class="button secondary" type="button" hidden>Centrar vista</button>
        <button id="action-button" class="button" type="button" hidden>Inspeccionar</button>
        <div id="keypad" class="keypad" aria-label="Teclado de código">
          <div id="code-display" class="code-display">____</div>
          <div class="keys">
            <button class="key-button" data-digit="1">1</button><button class="key-button" data-digit="2">2</button><button class="key-button" data-digit="3">3</button>
            <button class="key-button" data-digit="4">4</button><button class="key-button" data-digit="5">5</button><button class="key-button" data-digit="6">6</button>
            <button class="key-button" data-digit="7">7</button><button class="key-button" data-digit="8">8</button><button class="key-button" data-digit="9">9</button>
            <button class="key-button" data-digit="0">0</button><button id="clear-code" class="key-button">Borrar</button><button id="submit-code" class="key-button">OK</button>
          </div>
        </div>
        <button id="exit-button" class="button secondary" type="button" hidden>Cerrar</button>
      </div>
    </div>
  </section>

    document.querySelector('#scene').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x9698a6, 0x15100c, .5));
    const deskLamp = new THREE.PointLight(0xffbd69, 18, 11, 2);
    deskLamp.position.set(-1.4, 3.1, -1.3);
    scene.add(deskLamp);
    const ceiling = new THREE.PointLight(0xb9c5e8, 3, 13, 2);
    ceiling.position.set(1, 4.5, -2);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(22,22), woodFloor);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(12,5,.3), wallpaper);

    const uvGroup = new THREE.Group();

    const paperSheet = new THREE.Mesh(new THREE.BoxGeometry(1.05,.06,.75), paper);
    notebook.add(paperSheet);

    const door = new THREE.Group();

    doorMesh.position.y = 1.7;
    door.add(doorMesh);
    const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(2.3,3.9,.25), metal);
    doorFrame.position.set(0,1.95,.08);

    const doorSign = new THREE.Mesh(new THREE.BoxGeometry(.7,.25,.04), brass);
    doorSign.position.set(0,2.65,-.13);
    door.add(doorSign);
    const handle = new THREE.Mesh(new THREE.SphereGeometry(.09,12,8), brass);
    handle.position.set(.55,1.65,-.16);
    door.add(handle);
    door.position.set(3.9,0,-5.75);
    scene.add(door);

    const objects = { file:fileGroup, mirror, cabinet, uv:uvGroup, notebook, door };
    const gameState = { step:1, combination:'1947', hasUV:false, uvUsed:false, secretCode:'5826', enteredCode:'' };

    const recenterButton = document.querySelector('#recenter-button');
    const actionButton = document.querySelector('#action-button');
    const exitButton = document.querySelector('#exit-button');
    const success = document.querySelector('#success');
    const prompt = document.querySelector('#prompt');
    const clue = document.querySelector('#clue');
    const keypad = document.querySelector('#keypad');
    const codeDisplay = document.querySelector('#code-display');

      if (screen.orientation && typeof screen.orientation.angle === 'number') return THREE.MathUtils.degToRad(screen.orientation.angle);

      return 0;
