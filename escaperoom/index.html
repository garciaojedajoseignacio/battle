<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Escape Room | Osorno Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; --ink: #eaf2ed; --muted: #9aaca2; --accent: #e8b85c; --line: rgba(234,242,237,.16); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101817; color: var(--ink); font: 15px/1.4 Georgia, 'Times New Roman', serif; }
    #scene { position: fixed; inset: 0; z-index: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); pointer-events: none; }
    .topbar, .bottom { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .title { margin: 0; font-size: clamp(22px, 4vw, 38px); font-weight: 400; text-shadow: 0 2px 18px #000; }
    .eyebrow { margin: 0 0 4px; color: var(--accent); font: 11px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    .status { max-width: 330px; padding: 10px 12px; border: 1px solid var(--line); background: rgba(16,24,23,.7); color: var(--muted); font: 12px/1.3 Arial, sans-serif; pointer-events: auto; }
    .panel { max-width: 430px; padding: 16px 18px; border-left: 2px solid var(--accent); background: rgba(16,24,23,.76); box-shadow: 0 8px 30px rgba(0,0,0,.25); pointer-events: auto; }
    .panel p { margin: 0 0 12px; }
    .help { color: var(--muted); font: 12px/1.35 Arial, sans-serif; }
    .button { border: 1px solid var(--accent); padding: 10px 14px; background: var(--accent); color: #17211e; cursor: pointer; font: 700 12px Arial, sans-serif; letter-spacing: .7px; text-transform: uppercase; pointer-events: auto; touch-action: manipulation; }
    .button.secondary { border-color: var(--line); background: rgba(16,24,23,.75); color: var(--ink); }
    .button:disabled { cursor: wait; opacity: .7; }
    .button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .success { display: none; color: #b9e8c8; }
    .success.visible { display: block; }
    @media (max-width: 560px) { .topbar, .bottom { align-items: stretch; flex-direction: column; } .status { align-self: flex-start; } .panel { max-width: none; } }
  </style>
</head>
<body>
  <main id="scene" aria-label="Escena 3D del Escape Room"></main>
  <section class="hud">
    <div class="topbar">
      <div><p class="eyebrow">Osorno Battle / Misión 04</p><h1 class="title">Escape Room</h1></div>
      <div id="sensor-status" class="status" role="status" aria-live="polite">Sensores en espera</div>
    </div>
    <div class="bottom">
      <div class="panel">
        <p id="prompt">La puerta está oculta en la sala. Mira alrededor para encontrarla.</p>
        <p class="help">Mueve el teléfono para mirar en cualquier dirección. Puedes girar varias vueltas completas.</p>
        <p id="success" class="success">Salida encontrada. Misión completada.</p>
        <button id="sensor-button" class="button" type="button">Activar sensores</button>
        <button id="recenter-button" class="button secondary" type="button" hidden>Centrar vista</button>
        <button id="exit-button" class="button secondary" type="button" hidden>Cerrar</button>
      </div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

    const telegram = window.Telegram?.WebApp ?? null;
    telegram?.ready();
    telegram?.expand();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101817);
    scene.fog = new THREE.Fog(0x101817, 8, 25);

    const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 40);
    camera.position.set(0, 1.65, 0);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.querySelector('#scene').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xa8c2bb, 0x111513, 1.4));

    const lamp = new THREE.PointLight(0xe8b85c, 18, 13, 2);
    lamp.position.set(-2, 3.2, 1);
    scene.add(lamp);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(22, 22),
      new THREE.MeshStandardMaterial({ color: 0x273531, roughness: .88 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x34443f, roughness: .95 });

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, .3), wallMaterial);
    backWall.position.set(0, 2.5, -6);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(.3, 5, 12), wallMaterial);
    leftWall.position.set(-6, 2.5, 0);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(.3, 5, 12), wallMaterial);
    rightWall.position.set(6, 2.5, 0);
    scene.add(rightWall);

    const door = new THREE.Group();

    const doorMesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 3.1, .16),
      new THREE.MeshStandardMaterial({ color: 0x5a3831, roughness: .7 })
    );
    doorMesh.position.y = 1.55;
    door.add(doorMesh);

    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 3.6, .25),
      new THREE.MeshStandardMaterial({ color: 0x171d1a, roughness: .8 })
    );
    frame.position.set(0, 1.8, .08);
    door.add(frame);

    const sign = new THREE.Mesh(
      new THREE.BoxGeometry(.62, .24, .04),
      new THREE.MeshStandardMaterial({ color: 0xe8b85c, emissive: 0x5a3f15, emissiveIntensity: 1.3 })
    );
    sign.position.set(0, 2.4, -.12);
    door.add(sign);

    door.position.set(3.2, 0, -5.75);
    scene.add(door);

    const key = new THREE.Mesh(
      new THREE.TorusGeometry(.15, .035, 10, 24),
      new THREE.MeshStandardMaterial({ color: 0xe8b85c, metalness: .7, roughness: .25 })
    );
    key.position.set(-2.2, 1.2, -2.5);
    scene.add(key);

    let found = false;
    let orientationListening = false;
    let hasOrientation = false;

    let lastAlpha = null;
    let lastBeta = null;
    let lastGamma = null;

    let accumulatedYaw = 0;
    let accumulatedPitch = 0;
    let accumulatedRoll = 0;

    let targetYaw = 0;
    let targetPitch = 0;
    let targetRoll = 0;

    let dragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    const status = document.querySelector('#sensor-status');
    const button = document.querySelector('#sensor-button');
    const recenterButton = document.querySelector('#recenter-button');
    const exitButton = document.querySelector('#exit-button');
    const success = document.querySelector('#success');
    const prompt = document.querySelector('#prompt');

    function setStatus(text) {
      status.textContent = text;
    }

    function shortestAngleDelta(current, previous) {
      let delta = current - previous;

      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;

      return delta;
    }

    function resetOrientationReference() {
      hasOrientation = false;
      lastAlpha = null;
      lastBeta = null;
      lastGamma = null;

      accumulatedYaw = 0;
      accumulatedPitch = 0;
      accumulatedRoll = 0;

      targetYaw = 0;
      targetPitch = 0;
      targetRoll = 0;

      camera.rotation.set(0, 0, 0, 'YXZ');
      setStatus('Vista centrada. Mueve el teléfono suavemente.');
    }

    function updateOrientation(alpha, beta, gamma) {
      if (typeof alpha !== 'number' || typeof beta !== 'number' || typeof gamma !== 'number') return;

      if (!hasOrientation) {
        hasOrientation = true;
        lastAlpha = alpha;
        lastBeta = beta;
        lastGamma = gamma;
        setStatus('Sensores activos. Puedes girar varias vueltas.');
        return;
      }

      const deltaAlpha = shortestAngleDelta(alpha, lastAlpha);
      const deltaBeta = beta - lastBeta;
      const deltaGamma = gamma - lastGamma;

      lastAlpha = alpha;
      lastBeta = beta;
      lastGamma = gamma;

      accumulatedYaw += THREE.MathUtils.degToRad(deltaAlpha);
      accumulatedPitch += THREE.MathUtils.degToRad(deltaBeta);
      accumulatedRoll += THREE.MathUtils.degToRad(deltaGamma);

      accumulatedPitch = THREE.MathUtils.clamp(
        accumulatedPitch,
        -Math.PI / 2.2,
        Math.PI / 2.2
      );

      accumulatedRoll = THREE.MathUtils.clamp(
        accumulatedRoll,
        -0.45,
        0.45
      );

      targetYaw = accumulatedYaw;
      targetPitch = -accumulatedPitch;
      targetRoll = -accumulatedRoll;
    }

    function onDeviceOrientation(event) {
      updateOrientation(event.alpha, event.beta, event.gamma);
    }

    function attachBrowserOrientation() {
      if (orientationListening) return;

      addEventListener('deviceorientation', onDeviceOrientation, true);
      orientationListening = true;
    }

    function startTelegramSensors() {
      let started = false;
      const sensor = telegram?.DeviceOrientation;
      const accelerometer = telegram?.Accelerometer;

      if (typeof sensor?.start === 'function') {
        try {
          sensor.start({ refresh_rate: 30 }, error => {
            if (error) console.warn('Error de DeviceOrientation:', error);
          });
          started = true;
        } catch (error) {
          console.warn('No se pudo iniciar DeviceOrientation:', error);
        }
      }

      if (typeof sensor?.onEvent === 'function') {
        sensor.onEvent(data => {
          updateOrientation(data?.alpha, data?.beta, data?.gamma);
        });
      }

      // El acelerómetro no controla el giro horizontal.
      // Solo se inicia si Telegram lo ofrece.
      if (typeof accelerometer?.start === 'function') {
        try {
          accelerometer.start({ refresh_rate: 30 }, error => {
            if (error) console.warn('Error de Accelerometer:', error);
          });
        } catch (error) {
          console.warn('No se pudo iniciar Accelerometer:', error);
        }
      }

      return started;
    }

    async function enableSensors() {
      button.disabled = true;
      button.textContent = 'Solicitando permiso...';
      setStatus('Solicitando acceso a los sensores...');

      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') throw new Error('Permiso de sensores rechazado');
        }

        attachBrowserOrientation();
        startTelegramSensors();
        resetOrientationReference();

        button.textContent = 'Sensores activos';
        recenterButton.hidden = false;
      } catch (error) {
        console.error('No se pudieron activar los sensores:', error);
        setStatus(error.message || 'No se pudieron activar los sensores');
        button.disabled = false;
        button.textContent = 'Reintentar sensores';
      }
    }

    function checkExit() {
      const direction = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
      const toDoor = door.position.clone().sub(camera.position).normalize();

      if (!found && direction.dot(toDoor) > .94) {
        found = true;
        success.classList.add('visible');
        prompt.textContent = 'Has orientado la mirada hacia la puerta.';
        exitButton.hidden = false;
      }
    }

    button.addEventListener('click', enableSensors);
    recenterButton.addEventListener('click', resetOrientationReference);
    exitButton.addEventListener('click', () => telegram?.close());

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.domElement.addEventListener('pointerdown', event => {
      dragging = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      renderer.domElement.setPointerCapture?.(event.pointerId);
    });

    renderer.domElement.addEventListener('pointermove', event => {
      if (!dragging) return;

      const deltaX = event.clientX - lastPointerX;
      const deltaY = event.clientY - lastPointerY;

      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      targetYaw -= deltaX * .006;
      targetPitch = THREE.MathUtils.clamp(
        targetPitch - deltaY * .006,
        -Math.PI / 2.2,
        Math.PI / 2.2
      );
    });

    renderer.domElement.addEventListener('pointerup', event => {
      dragging = false;
      renderer.domElement.releasePointerCapture?.(event.pointerId);
    });

    renderer.domElement.addEventListener('pointercancel', () => {
      dragging = false;
    });

    function animate() {
      requestAnimationFrame(animate);

      camera.rotation.x = THREE.MathUtils.lerp(camera.rotation.x, targetPitch, .12);
      camera.rotation.y = THREE.MathUtils.lerp(camera.rotation.y, targetYaw, .12);
      camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, targetRoll, .12);
      camera.rotation.order = 'YXZ';

      key.rotation.y += .01;
      lamp.intensity = 16 + Math.sin(performance.now() * .002) * 2;

      checkExit();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
